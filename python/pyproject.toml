[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easydoc"
version = "1.0.0"
description = "EasyDoc — Python PDF toolkit. Developed by Mahmudul Hasan."
authors = [{name = "Mahmudul Hasan"}]
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "pypdf>=4",
    "python-docx>=1.1",
    "pdf2docx>=0.5.6",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "Pillow>=10",
    "reportlab>=4",
    "pytesseract>=0.3",
    "deep-translator>=1.11",
]

[project.scripts]
easydoc = "easydoc.cli:main"
easydoc-gui = "easydoc.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
