# EasyDoc — build Android APK + Windows .exe on GitHub Actions
name: Build EasyDoc
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  windows-exe:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice and Tesseract
        run: |
          choco install libreoffice-fresh tesseract -y --execution-timeout=7200
      - name: Install Python requirements
        run: |
          python -m pip install -r python/requirements.txt
          python -m pip install pyinstaller
      - name: Build .exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name EasyDoc --add-data "python/src/easydoc;easydoc" python/src/easydoc/gui.py
      - name: Upload .exe
        uses: actions/upload-artifact@v4
        with:
          name: EasyDoc-Windows
          path: dist/EasyDoc.exe
  android-apk:
    name: Android APK
    # Pinned to 24.04: ubuntu-latest is now Ubuntu 26, whose newer
    # autotools break the libffi 3.4.2 autoreconf used by
    # python-for-android (LT_SYS_SYMBOL_USCORE). Ubuntu 24.04 ships
    # the autoconf 2.71 / automake 1.16 / libtool 2.4.7 combination
    # that libffi 3.4.2 was built and tested against.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17 and system deps
        run: |
          sudo apt-get update
          # libffi's autoreconf needs the full autotools set. p4a's
          # libffi recipe (v3.4.2) states it needs automake (aclocal),
          # autoconf, and libltdl-dev, which provides the
          # LT_SYS_SYMBOL_USCORE macro; without libltdl-dev autoreconf
          # fails with "possibly undefined macro: LT_SYS_SYMBOL_USCORE".
          sudo apt-get install -y openjdk-17-jdk unzip autoconf automake libtool libtool-bin libltdl-dev m4 pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
      - name: Check autotools for libffi autoreconf
        run: |
          autoconf --version | head -1
          automake --version | head -1
          libtool --version | head -1
          aclocal --print-ac-dir
          grep -l "LT_SYS_SYMBOL_USCORE" "$(aclocal --print-ac-dir)/ltdl.m4" || echo "WARNING: LT_SYS_SYMBOL_USCORE not found in ltdl.m4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          # Pinned pair: Buildozer 1.6.0 (May 2026, latest) expects
          # p4a branch master (its default) and the Kivy/p4a recipes
          # need Cython 0.29.x, not Cython 3. Do NOT use 1.5.0: it
          # imports distutils.version.LooseVersion, and distutils was
          # removed in Python 3.12, so 1.5.0 cannot even start.
          python -m pip install "buildozer==1.6.0" "cython==0.29.36"
      - name: Accept Android SDK licenses
        run: |
          for SDK in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "$HOME/.buildozer/android/platform/android-sdk"; do
            if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
              yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
              yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;37.0.0" "platform-tools" || true
            fi
          done
      - name: Build APK (debug)
        working-directory: python/android
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyDoc-Android-APK
          path: python/android/bin/*.apk
